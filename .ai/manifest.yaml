# .ai/manifest.yaml - the agent-facing contract for this repo (ai-manifest spec).
schema: ai-manifest
schemaVersion: 0.1.0
generatedAt: "2026-10-20"

repo:
  name: athena-muse

registry:
  remote: github:xkazm04/ai-registry
  local: ../ai-registry
knowledge:
  domains: [software-engineering]

skills:
  - spark
  - uat
  - tiger

capabilities:
  docs-check:
    command: node scripts/check.mjs
  typecheck:
    command: pnpm -C apps/desktop typecheck && uv run mypy
  lint:
    command: pnpm -C apps/desktop lint && uv run ruff check src tests && uv run ruff format --check src tests
  test:
    command: pnpm -C apps/desktop test && uv run pytest -q
