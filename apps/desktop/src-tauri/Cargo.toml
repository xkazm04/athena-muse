[package]
name = "athena-desktop"
version = "0.1.0"
description = "Athena on Muse: the desktop shell"
edition = "2021"
rust-version = "1.77"

[lib]
name = "athena_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
