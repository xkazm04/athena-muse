[project]
name = "athena"
version = "0.1.0"
description = "Athena on Muse - the local daemon"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "starlette>=0.41",
  "uvicorn>=0.32",
  "httpx>=0.27",
]

# The keyring seal for connected accounts off Windows (ADR 0008); Windows seals with DPAPI and needs
# nothing. Without it, elsewhere, a credential rests in an owner-only file that says so.
[project.optional-dependencies]
connectors = ["keyring>=25"]

[project.scripts]
athena-daemon = "athena.server:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.7",
  "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/athena"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
packages = ["athena"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
